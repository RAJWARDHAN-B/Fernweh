[project]
name = "fernweh-evals"
version = "0.1.0"
description = "DeepEval datasets, metrics, and suites for Fernweh agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepeval>=4.2.5",
    "fernweh-domain",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
fernweh-domain = { workspace = true }
