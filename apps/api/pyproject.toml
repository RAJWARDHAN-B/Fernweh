[project]
name = "fernweh-api"
version = "0.1.0"
description = "Fernweh HTTP API, orchestration, and guardrails"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fernweh-domain",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
fernweh-domain = { workspace = true }
